[project]
name = "occams"
version = "1.0.1"
description = "A falsification lab for retail trading hypotheses: register before measuring, five guards, a hash-chained Register; nothing places an order"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# numpy is the vendored core's only third-party import (F1). pandas is
# admitted by the M1.3 closure test but not yet required by anything.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# scipy is a TEST-ONLY oracle for occams/core/stats.py, as in the donor:
# testing our implementation against scipy pins OUR numbers. ruff is PINNED,
# not floored — the donor watched two machines disagree about the rules.
dev = ["pytest>=8.0", "ruff==0.16.9", "scipy>=1.11"]

[project.urls]
Homepage = "https://maverickhq.github.io/occams-test-lab/"
Repository = "https://github.com/MaverickHQ/occams-test-lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
# M14.0: twenty test files import `from tests.…`; `python -m pytest` puts the
# repo root on the path and a bare `pytest` does not — this line makes both
# collect. Not `tests/__init__.py`, which renames every module.
pythonpath = ["."]
# M14.1: the fast cycle is every test not marked slow (`make test-fast`);
# `make check` and CI run the whole suite.
markers = [
  "slow: a test that takes seconds, not milliseconds — skipped by `make test-fast`, never by `make check`",
  "calibration: a row of the size-and-power table, minutes over hundreds of seeds — run by `make calibrate` and a scheduled workflow, never by `make check` (M16.7)",
  "real_identity: a test of the engine's identity itself — it reads the tree's own commit and dirtiness instead of the identity the suite is supplied (M16.10, ADR-0055)",
]
# One vendored case asserts that pyarrow is a declared dependency — true of
# the donor's derived bar layer, not of this repository, which has none.
# Deselected here BY NAME so the exclusion is visible in one place; the test
# file itself is byte-identical to the donor's up to PROVENANCE.md's rules.
# M16.7: the calibration rows are deselected here by marker; `make calibrate` selects them.
addopts = "-q --strict-markers -m 'not calibration' --deselect tests/core/test_archive.py::test_the_query_layer_needs_no_engine"

[tool.ruff]
# M16.12 (the review's F24): the lab's lines are written to 160. The review asks for 120;
# 1,157 lines exceed that and 64 exceeded 160, so 160 is the length stated and enforced.
line-length = 160
target-version = "py312"
# The vendored core and its tests are the DONOR's code at a recorded hash
# (PROVENANCE.md). Linting them here would either fail on rules the donor
# never adopted or invite the edit that breaks the hash test. Excluded
# deliberately; they are linted in the donor.
extend-exclude = ["occams/core/", "tests/core/"]

[tool.ruff.lint]
# STATED, not inherited (see the donor's pyproject for the story). Widened at M16.12 from
# E4, E7, E9 and F: the whole of pycodestyle's errors, bugbear, simplify, pyupgrade, complexity.
select = ["E", "F", "B", "SIM", "UP", "C90"]
ignore = ["SIM108"]     # a ternary is not always the clearer form; the three it asks for would each be a longer line

[tool.ruff.lint.mccabe]
# The review asks for 15, which eleven functions exceed — both simulators among them, and
# this row restructures no engine. 25 is the bound the code meets but for three long entry
# points, excused by name below; it holds the line where it is.
max-complexity = 25

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: a call to one in a default argument builds a value nothing can mutate.
extend-immutable-calls = [
  "occams.data.actions.ActionSeries", "occams.measurement.Floor", "occams.hypothesis.PowerPlan", "occams.hypothesis.Gates",
  "occams.proposers.base.Sweep", "occams.spec.spec.RegimeGate", "occams.spec.RegimeGate", "occams.forward.window.ForwardWindow",
]

[tool.ruff.lint.per-file-ignores]
# Pages: HTML and CSS held in strings, which do not wrap.
"occams/console/render.py" = ["E501"]
"occams/console/site.py" = ["E501"]
"occams/console/programme.py" = ["E501"]
"occams/survey/page.py" = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["occams*"]

[tool.setuptools.package-data]
"occams.core" = ["PROVENANCE.json"]
