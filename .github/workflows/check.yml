name: check

# N3 — CI from the first commit. The donor added it late and it found six
# defects in three runs, every one invisible while checks ran on one machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        # No AWS, no network: the vendored archive tests run against bogus
        # credentials exactly as they do in the donor.
        env:
          AWS_ACCESS_KEY_ID: ci-has-no-aws
          AWS_SECRET_ACCESS_KEY: ci-has-no-aws
          AWS_DEFAULT_REGION: us-east-1
          OCCAMS_RESEARCH_BUCKET: ci-has-no-bucket
        run: python -m pytest
      - name: Lint
        run: python -m ruff check occams/ tests/ scripts/ tools/
      - name: Credential scan (S5)
        run: python tools/credscan.py
      - name: Provenance (M1.5)
        run: python tools/vendor_core.py --verify
      - name: Quickstart (S2)
        run: python scripts/quickstart.py
      - name: make null (S3)
        run: python -m occams.controls null
      - name: make signal (S10)
        run: python -m occams.controls signal
      - name: make null through the day-boxed engine (S3)
        run: python -m occams.controls null --engine=day_boxed
      - name: make signal through the day-boxed engine (S10)
        run: python -m occams.controls signal --engine=day_boxed
      - name: Console, offline (M11.4)
        # No archive and no config on this machine: the plain build, from the
        # committed Register alone. The controls recompute inside it.
        run: make console-offline
      - name: Publication gate (M11.7)
        # Every committed page and Register, and the offline console just built:
        # no script, no network, no credential shape, no broker term, no raw bars, no money key.
        run: python tools/prepublish.py

  # M15.4 — the setup path on a clean machine: a fresh runner is one. `make setup`,
  # the skeleton from `init`, then the configuration filled with the TEST FIXTURE's
  # numbers — absurd on purpose and a fixture, never a recommendation (R9, R4) —
  # so `doctor` can pass and the quickstart can run. Nothing here is the author's.
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: make setup
        run: make setup
      - name: init writes the skeleton, no value in it
        run: |
          .venv/bin/python -m occams init --out occams.toml
          ! grep -Eq "=\s*[0-9]" occams.toml
          if .venv/bin/python -m occams doctor --config occams.toml; then echo "doctor passed on a skeleton"; exit 1; fi
      - name: the fixture's numbers stand in for the author's, so the path can be walked
        run: |
          .venv/bin/python - <<'PY'
          import copy
          from pathlib import Path
          from tests.test_config import FIXTURE
          from tests.test_console import MONEY, _toml
          d = copy.deepcopy(FIXTURE)
          d["capital"].update(MONEY)
          Path("occams.toml").write_text(_toml(d), encoding="utf-8")
          PY
      - name: doctor, then the quickstart (S2)
        run: |
          .venv/bin/python -m occams doctor --config occams.toml
          PATH="$PWD/.venv/bin:$PATH" make quickstart
