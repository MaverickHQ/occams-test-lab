# M15.2 — the lab's pages on GitHub Pages. Manual only, and gated twice: nothing
# deploys unless the publication decision (R7) is a committed record —
# docs/PUBLICATION.md with a line reading `Decision: publish`, dated and signed by
# the author (M15.12) — and unless every page passes the publication check.
# The repository's visibility and the Pages source ("GitHub Actions") are the
# author's settings; this workflow never changes them.
name: pages
on:
  workflow_dispatch:
# Every job reads; only `deploy` may write Pages and mint the OIDC token
# (pre-publication audit, 2026-09-27).
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The publication decision must be a record (R7, M15.12)
        run: |
          test -f docs/PUBLICATION.md || { echo "REFUSED: docs/PUBLICATION.md does not exist — publication is a recorded decision (R7)"; exit 1; }
          grep -Eq '^Decision: publish' docs/PUBLICATION.md || { echo "REFUSED: docs/PUBLICATION.md records no 'Decision: publish' line"; exit 1; }
          grep -Eq '^Date: [0-9]{4}-[0-9]{2}-[0-9]{2}' docs/PUBLICATION.md || { echo "REFUSED: the decision carries no date"; exit 1; }
          grep -Eq '^By: .+' docs/PUBLICATION.md || { echo "REFUSED: the decision names no author"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Publication gate on the sources (M11.7)
        run: make prepublish
      - name: Build the site and check every page it wrote
        run: make site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
